<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SidelineReel — Jersey Match Review (Prototype)</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--muted:#626b76;--line:#e3e6ea;--brand:#0f766e;--brand2:#ccfbf1;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--ok:#15803d;--okbg:#dcfce7}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header b{font-size:18px}
  header small{color:#aab}
  nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  nav button{background:#2c333b;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
  nav button.on{background:var(--brand)}
  .badge{display:inline-block;background:var(--warn);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
  main{max-width:1050px;margin:0 auto;padding:18px 16px 60px}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
  .m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .m .v{font-size:22px;font-weight:700}
  .m .d{font-size:12px;color:var(--muted)}
  .m.old{opacity:.65}
  .m.old .v{text-decoration:line-through}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{margin:0 0 4px;font-size:20px}
  h3{margin:0 0 8px;font-size:16px}
  .sub{color:var(--muted);margin:0 0 14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
  .p-ok{background:var(--okbg);color:var(--ok)} .p-hold{background:var(--warnbg);color:var(--warn)} .p-bad{background:var(--badbg);color:var(--bad)} .p-info{background:var(--brand2);color:var(--brand)}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}
  .btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600}
  .btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.alt{background:#1e40af;color:#fff;border-color:#1e40af}
  .btn.danger{color:var(--bad)}
  .btn:disabled{opacity:.4;cursor:default}
  .chips span{display:inline-block;background:#eef1f4;border-radius:6px;padding:3px 8px;margin:2px;font-size:13px}
  .chips span.c{background:var(--warnbg);color:var(--warn);font-weight:600}
  .still{position:relative;height:230px;border-radius:10px;overflow:hidden;background:linear-gradient(#5b9b4a,#3f7d36)}
  .still .line{position:absolute;left:0;right:0;top:50%;height:2px;background:#ffffff55}
  .jersey{position:absolute;width:86px;height:98px;border-radius:14px 14px 8px 8px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff}
  .zoom{position:absolute;right:10px;top:10px;width:110px;height:110px;border:3px solid #fff;border-radius:10px;background:#3f7d36;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:#fff;overflow:hidden}
  .zoom span{filter:blur(2.2px)}
  .zl{position:absolute;right:10px;top:124px;color:#fff;font-size:11px;background:#0008;padding:2px 6px;border-radius:4px}
  .empty{text-align:center;color:var(--muted);padding:30px}
  .reel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .clip{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .clip .th{height:84px;background:linear-gradient(135deg,#3f7d36,#5b9b4a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
  .clip .b{padding:8px;font-size:13px}
  .clip button{margin-top:6px;width:100%;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px;cursor:pointer;font-size:12px;color:var(--bad)}
  .hero{display:flex;gap:14px;align-items:center;margin-bottom:12px}
  .hero .th{width:190px;height:110px;border-radius:10px;background:linear-gradient(135deg,#0f766e,#3f7d36);display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:800}
  select,input[type=range]{font-size:14px}
  .note{font-size:13px;color:var(--muted);background:#f1f5f9;border-radius:8px;padding:8px 10px;margin-top:10px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
  .log{font-size:12px;color:var(--muted);max-height:140px;overflow:auto;font-family:ui-monospace,Menlo,monospace}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
</style>
</head>
<body>
<header>
  <div><b>SidelineReel</b> <small>· Jersey Match Confidence + Coach Review · prototype</small></div>
  <nav>
    <button data-s="tag" class="on">1 · Tagging &amp; routing</button>
    <button data-s="review">2 · Coach review <span class="badge" id="qcount">0</span></button>
    <button data-s="parent">3 · Parent reel</button>
  </nav>
</header>

<main>
  <div class="metrics" id="metrics"></div>
  <section id="s-tag"></section>
  <section id="s-review" hidden></section>
  <section id="s-parent" hidden></section>
  <footer>Simulated data, fictional players. Prototype by <b>Muhammad Izaan</b> (<a href="mailto:izaanatif@gmail.com">izaanatif@gmail.com</a>) for the Ajaia PM assessment · <a href="https://ajaia.ai">ajaia.ai</a></footer>
</main>
<div class="toast" id="toast"></div>

<script>
// ---------- Data (simulated) ----------
const ROSTER = [
  {n:1,name:"Leo Park"},{n:4,name:"Sofia Reyes"},{n:7,name:"Ava Chen"},{n:9,name:"Noah Bell"},
  {n:11,name:"Mateo Diaz"},{n:12,name:"Isla Grant"},{n:14,name:"Maya Ortiz"},{n:21,name:"Eli Brooks"},
  {n:17,name:"Zara Khan"},{n:23,name:"Ben Novak"}
];
// predicted = number the tagger matched; truth = who it really is (only the prototype knows; shown in "audit" column)
const CLIPS = [
  {id:"c1", t:"03:12", ev:"Goal",        pred:14, conf:0.93, truth:4},
  {id:"c2", t:"07:45", ev:"Save",        pred:1,  conf:0.88, truth:11},
  {id:"c3", t:"11:02", ev:"Assist",      pred:9,  conf:0.95, truth:9},
  {id:"c4", t:"15:30", ev:"Tackle",      pred:14, conf:0.99, truth:14},
  {id:"c5", t:"19:18", ev:"Goal",        pred:21, conf:0.91, truth:12},
  {id:"c6", t:"22:40", ev:"Big play",    pred:7,  conf:0.97, truth:7},
  {id:"c7", t:"26:05", ev:"Shot",        pred:23, conf:0.84, truth:23},
  {id:"c8", t:"31:50", ev:"Goal",        pred:11, conf:0.98, truth:11},
  {id:"c9", t:"34:12", ev:"Save",        pred:4,  conf:0.98, truth:4},
  {id:"c10",t:"38:27", ev:"Dribble",     pred:17, conf:0.975, truth:17},
  {id:"c11",t:"41:03", ev:"Goal",        pred:14, conf:0.985, truth:14},
  {id:"c12",t:"44:48", ev:"Block",       pred:12, conf:0.97, truth:12},
];
const state = {
  base:0.90, confusable:0.97, screen:"tag",
  decisions:{},   // clipId -> {final:number|null, source:'coach'}
  flags:{},       // clipId -> true (parent flagged "Not my kid")
  log:[], parentKid:14, idx:0
};

// ---------- Logic ----------
function confusablePairs(roster){
  const nums = roster.map(r=>r.n), pairs=[];
  for(let i=0;i<nums.length;i++)for(let j=i+1;j<nums.length;j++){
    const a=String(nums[i]), b=String(nums[j]);
    const contained = (a.length!==b.length) && (a.includes(b)||b.includes(a));
    const swapped = a.length===2 && b.length===2 && a===b.split("").reverse().join("");
    if(contained||swapped) pairs.push([nums[i],nums[j], contained?"contained":"swapped"]);
  }
  return pairs;
}
const PAIRS = confusablePairs(ROSTER);
const altsFor = n => PAIRS.filter(p=>p[0]===n||p[1]===n).map(p=>p[0]===n?p[1]:p[0]);
const nameOf = n => (ROSTER.find(r=>r.n===n)||{}).name || "—";

function route(c){
  const isConf = altsFor(c.pred).length>0;
  const th = isConf ? state.confusable : state.base;
  return {isConf, th, status: c.conf>=th ? "auto" : "held"};
}
// Final owner of a clip, or null if not (yet) in any reel
function owner(c){
  if(state.decisions[c.id]) return state.decisions[c.id].final;
  const r = route(c);
  return r.status==="auto" ? c.pred : null;
}
function heldQueue(){
  return CLIPS.filter(c => !state.decisions[c.id] && (route(c).status==="held" || state.flags[c.id]));
}
function reelFor(n){
  return CLIPS.filter(c => owner(c)===n && !state.flags[c.id]);
}

// ---------- Render ----------
function metrics(){
  const delivered = CLIPS.filter(c=>owner(c)!==null && !state.flags[c.id]);
  const wrong = delivered.filter(c=>owner(c)!==c.truth).length;
  // Naive "before" = every clip auto-assigned to predicted number
  const wrongBefore = CLIPS.filter(c=>c.pred!==c.truth).length;
  const held = heldQueue().length;
  document.getElementById("metrics").innerHTML = `
    <div class="m old"><div class="v">92%</div><div class="d">Old "Reel Share Rate" — counted only over opened reels</div></div>
    <div class="m"><div class="v">≈64%</div><div class="d">Share rate over <b>generated</b> reels (0.70 open × 0.92)</div></div>
    <div class="m"><div class="v" style="color:${wrong?'var(--bad)':'var(--ok)'}">${wrong} <small style="font-size:13px;color:var(--muted)">vs ${wrongBefore} before</small></div><div class="d">Wrong-kid clips in reels this game</div></div>
    <div class="m"><div class="v" style="color:${held?'var(--warn)':'var(--ok)'}">${held}</div><div class="d">Clips held for coach review</div></div>`;
  document.getElementById("qcount").textContent = held;
}

function renderTag(){
  const rows = CLIPS.map(c=>{
    const r = route(c), d=state.decisions[c.id];
    let st = d ? `<span class="pill p-info">Coach → #${d.final??"removed"}</span>`
           : state.flags[c.id] ? `<span class="pill p-bad">Parent flagged</span>`
           : r.status==="auto" ? `<span class="pill p-ok">Auto-approved</span>` : `<span class="pill p-hold">Held for review</span>`;
    const alts = altsFor(c.pred);
    const correct = (owner(c)===null) ? '<span style="color:var(--muted)">not in any reel</span>'
       : owner(c)===c.truth ? '<span style="color:var(--ok)">✓ right kid</span>' : '<span style="color:var(--bad)">✗ wrong kid</span>';
    return `<tr><td>${c.t}</td><td>${c.ev}</td><td><b>#${c.pred}</b> ${nameOf(c.pred)}</td>
      <td>${c.conf.toFixed(2)} <small style="color:var(--muted)">/ need ${r.th.toFixed(2)}</small></td>
      <td>${alts.length?`<span class="pill p-hold">vs #${alts.join(", #")}</span>`:'<span style="color:var(--muted)">—</span>'}</td>
      <td>${st}</td><td>${correct}</td></tr>`;
  }).join("");
  document.getElementById("s-tag").innerHTML = `
  <div class="card">
    <h2>Saturday vs. Lakeview FC — tagging results</h2>
    <p class="sub">Every tagged clip gets a confidence score. Numbers that look alike on this roster need a higher bar, or they wait for the coach. Ambiguous clips are never auto-sent.</p>
    <div class="grid2">
      <div>
        <h3>Confusable pairs (computed from roster on save)</h3>
        <div class="chips">${ROSTER.map(r=>`<span class="${altsFor(r.n).length?'c':''}">#${r.n} ${r.name}</span>`).join("")}</div>
        <div class="note">${PAIRS.map(p=>`#${p[0]} / #${p[1]} <i>(${p[2]==="contained"?"one number inside the other":"swapped digits"})</i>`).join(" · ")}</div>
      </div>
      <div>
        <h3>Routing thresholds (config, no deploy)</h3>
        <label>Normal numbers: <b id="bv">${state.base.toFixed(2)}</b></label><br>
        <input type="range" min="0.70" max="0.99" step="0.01" value="${state.base}" id="rb" style="width:100%"><br>
        <label>Confusable numbers: <b id="cv">${state.confusable.toFixed(2)}</b></label><br>
        <input type="range" min="0.80" max="0.995" step="0.005" value="${state.confusable}" id="rc" style="width:100%">
        <div class="note">Try dragging the confusable bar down to 0.90 — watch wrong-kid clips leak back into reels.</div>
      </div>
    </div>
  </div>
  <div class="card" style="overflow-x:auto">
    <table><thead><tr><th>Time</th><th>Event</th><th>Tagger matched</th><th>Confidence</th><th>Look-alike</th><th>Status</th><th>Audit (ground truth)</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="go('review')">Open coach review queue →</button></div>
  </div>`;
  const rb=document.getElementById("rb"); rb.oninput=e=>{document.getElementById("bv").textContent=(+e.target.value).toFixed(2)}; rb.onchange=e=>{state.base=+e.target.value; refresh();};
  const rc=document.getElementById("rc"); rc.oninput=e=>{document.getElementById("cv").textContent=(+e.target.value).toFixed(3)}; rc.onchange=e=>{state.confusable=+e.target.value; refresh();};
}

function renderReview(){
  const q = heldQueue();
  const el = document.getElementById("s-review");
  if(!q.length){
    el.innerHTML = `<div class="card empty"><h2>All clear ✓</h2><p>No clips waiting. Reels will send Saturday 9:00 AM with only confirmed clips.</p>
      <button class="btn pri" onclick="go('parent')">See a parent's reel →</button>
      ${logHtml()}</div>`;
    return;
  }
  if(state.idx>=q.length) state.idx=0;
  const c = q[state.idx];
  const alts = altsFor(c.pred);
  const flagged = !!state.flags[c.id];
  el.innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><h2>Quick check: who is this?</h2><p class="sub">Clip ${state.idx+1} of ${q.length} · ${c.ev} at ${c.t} · ${flagged?'<span class="pill p-bad">A parent said "Not my kid"</span>':'<span class="pill p-hold">Held: look-alike numbers</span>'}</p></div>
      <div class="row"><button class="btn" ${state.idx===0?'disabled':''} onclick="state.idx--;refresh()">← Prev</button><button class="btn" onclick="state.idx=(state.idx+1)%${q.length};refresh()">Skip →</button></div>
    </div>
    <div class="grid2">
      <div>
        <div class="still"><div class="line"></div>
          <div class="jersey" style="left:24%;top:38%;background:#1e3a8a">${c.truth}</div>
          ${alts[0]!==undefined?`<div class="jersey" style="left:52%;top:20%;background:#1e3a8a;opacity:.55;transform:scale(.8)">${c.truth===c.pred?alts[0]:c.pred}</div>`:''}
          <div class="zoom"><span>${c.truth}</span></div><div class="zl">jersey zoom</div>
        </div>
        <div class="note">Real build: 3-second loop + zoomed jersey crop. Here the zoom is blurred the way motion blur makes "4" and "14" hard for the tagger.</div>
      </div>
      <div>
        <p>Tagger thinks this is <b>#${c.pred} ${nameOf(c.pred)}</b> (confidence ${c.conf.toFixed(2)}).</p>
        <div style="display:grid;gap:8px">
          <button class="btn pri" onclick="decide('${c.id}',${c.pred})">✓ Yes, it's #${c.pred} ${nameOf(c.pred)}</button>
          ${alts.map(a=>`<button class="btn alt" onclick="decide('${c.id}',${a})">It's #${a} ${nameOf(a)}</button>`).join("")}
          <select class="btn" onchange="if(this.value)decide('${c.id}',+this.value)">
            <option value="">Pick someone else…</option>${ROSTER.map(r=>`<option value="${r.n}">#${r.n} ${r.name}</option>`).join("")}
          </select>
          <button class="btn danger" onclick="decide('${c.id}',null)">Not our player / remove clip</button>
        </div>
        <div class="note">Unreviewed clips are left out of Saturday's reels, never guessed. A missing clip beats a wrong kid.</div>
      </div>
    </div>
    ${logHtml()}
  </div>`;
}
function logHtml(){ return state.log.length?`<h3 style="margin-top:14px">Label log (sent to ML team for retraining)</h3><div class="log">${state.log.map(l=>`<div>${l}</div>`).join("")}</div>`:""; }

function renderParent(){
  const n = state.parentKid, reel = reelFor(n);
  const thumbClip = reel.find(c=>c.conf>=0.95 || state.decisions[c.id]);
  document.getElementById("s-parent").innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><h2>Parent view: weekly reel</h2><p class="sub">Viewing as the family of
      <select id="pk">${ROSTER.map(r=>`<option value="${r.n}" ${r.n===n?'selected':''}>#${r.n} ${r.name}</option>`).join("")}</select></p></div>
    </div>
    <div class="hero">
      <div class="th">${thumbClip?'#'+thumbClip.truth:'—'}</div>
      <div><h3>${nameOf(n)}'s highlights · vs. Lakeview FC</h3>
      <div style="color:var(--muted);font-size:13px">${reel.length} clip${reel.length===1?'':'s'} · Thumbnail chosen only from confident or coach-confirmed clips</div>
      <div class="row" style="margin-top:8px"><button class="btn pri" onclick="toast('Shared to family group ✓')">Share reel</button></div></div>
    </div>
    ${reel.length?`<div class="reel">${reel.map(c=>`
      <div class="clip"><div class="th">#${c.truth}</div><div class="b"><b>${c.ev}</b> · ${c.t}
      ${c.truth!==n?'<div style="color:var(--bad);font-size:12px">⚠ this is actually #'+c.truth+'</div>':''}
      <button onclick="flag('${c.id}')">Not my kid</button></div></div>`).join("")}</div>`
      :`<div class="empty">No confirmed clips yet. ${heldQueue().some(c=>c.pred===n||altsFor(c.pred).includes(n))?'Some clips are waiting for the coach to confirm.':''}</div>`}
    <div class="note">Jersey numbers on clip tiles show who is actually in the clip (ground truth, for demo). Lower the confusable threshold on screen 1 and come back to see a wrong kid slip into this reel, then flag it.</div>
  </div>`;
  document.getElementById("pk").onchange = e=>{state.parentKid=+e.target.value; refresh();};
}

// ---------- Actions ----------
function decide(id, final){
  const c = CLIPS.find(x=>x.id===id);
  state.decisions[id] = {final, source:"coach"};
  delete state.flags[id];
  state.log.unshift(`${new Date().toLocaleTimeString()} clip=${id} predicted=#${c.pred} final=${final===null?'removed':'#'+final} source=coach ${final===c.pred?'(confirmed)':'(corrected)'}`);
  toast(final===null?"Clip removed":`Added to #${final} ${nameOf(final)}'s reel`);
  refresh();
}
function flag(id){
  const c = CLIPS.find(x=>x.id===id);
  state.flags[id]=true;
  delete state.decisions[id];
  state.log.unshift(`${new Date().toLocaleTimeString()} clip=${id} predicted=#${c.pred} source=parent_flag (hidden, sent to coach)`);
  toast("Hidden from your reel · sent to coach to fix");
  refresh();
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800);}
function go(s){state.screen=s;refresh();}
function refresh(){
  ["tag","review","parent"].forEach(s=>document.getElementById("s-"+s).hidden = s!==state.screen);
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===state.screen));
  metrics();
  if(state.screen==="tag") renderTag();
  if(state.screen==="review") renderReview();
  if(state.screen==="parent") renderParent();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.s));
refresh();
</script>
</body>
</html>
